# Shared instructions are appended to every advisor's fixed system prompt.
instructions: |
  Review the primary agent independently. Surface only concrete mistakes, missing constraints, security risks, or materially better approaches.
  One note per update. Severity scales by consequence, not category: `nit` when ignoring it costs the user nothing durable, `concern` when it costs real work or ships a defect, `blocker` only when continuing clearly wastes work or ships broken output.
  If the primary already acknowledged or fixed the same proposal, stay silent. A materially different fix or new evidence may still be useful; explain why it improves the requested outcome. Every note must contain one concrete problem and one concrete fix.

# Advisors run independently and in parallel. Names must be unique.
advisors:
  # `name` is required display text used in status and stored provenance.
  - name: Primary reviewer

    # `enabled` defaults to true; false keeps the entry in the roster but does not run it.
    enabled: true

    # `model` is `<provider>/<model-id>[:level]`. It overrides `default_model`; an entry
    # without one and no `default_model` is skipped with a startup warning. The level is
    # passed to OpenCode as the agent variant, so any level the model declares in
    # OpenCode's catalog works; `variant_aliases` rewrites a level OpenCode does not know.
    model: <provider>/<model-id>:<level>

    # `fallback` is the single retry model; lists and fallback chains are unsupported.
    # Omit it to inherit `default_fallback`, or `default_model` when that is this model.
    fallback: <provider>/<other-model-id>:<level>

    # `tools` defaults to [read, grep, glob]. Explicit [] grants no investigative tools.
    # Aliases are accepted: search -> grep and find -> glob.
    tools: [read, grep, glob]

    # Per-advisor `instructions` specialize this reviewer. `prompt` is an alias.
    instructions: |
      Act as the primary rigorous reviewer. Check correctness, completeness, architecture, and whether verification proves the requested behavior.
      Prefer reading the changed files over trusting the primary's summary.

    # `min_severity` overrides the config value: nit, concern, or blocker.
    min_severity: nit

    # `chat_min_severity` and `inject_min_severity` override the config values for this
    # reviewer's notes: the lowest severity shown as a chat card, and the lowest severity
    # injected into the primary's next step.
    chat_min_severity: blocker
    inject_min_severity: concern

    # `when` gates the reviewer. Without it the reviewer runs on every completed step.
    # With it, the reviewer runs only when the delta since its last pass contains a match;
    # skipped deltas carry over. `edits` are globs against the path of a completed edit,
    # write, or apply_patch, relative to the watched directory (absolute when the glob
    # starts with /). `commands` are regexes against a completed bash command. `tools` are
    # bare names of other tools (task, todowrite); edit, write, apply_patch, and bash are
    # rejected here. An empty or fully invalid `when` never runs and warns at startup.
    when:
      edits: ["**/*.ts", "src/**"]
      commands: ["\\bsed\\s+-i\\b", "\\bcat\\s*>"]
      tools: [task]

  # A second reviewer on a different model family gives an independent view.
  - name: Second reviewer
    enabled: true
    model: <provider>/<other-model-id>:<level>
    fallback: <provider>/<model-id>:<level>
    tools: [read, grep, glob]
    instructions: |
      Take an independent second view. Check constraints and failure paths before commenting.
    min_severity: nit
